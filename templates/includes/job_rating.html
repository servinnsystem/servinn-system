<div style="font-size:12px;margin:10px 0">
  <span>Job seeker rating</span>
  <span role="img" aria-label="{% if job.rating_count %}{{ job.rating_average }} out of 5 from {{ job.rating_count }} ratings{% else %}No ratings yet{% endif %}" title="{% if job.rating_count %}{{ job.rating_average }}/5 ({{ job.rating_count }} ratings){% else %}No ratings yet{% endif %}" style="position:relative;display:inline-block;font-size:22px;line-height:1;color:#d3d8d3;white-space:nowrap"><span aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span><span aria-hidden="true" data-job-rating-width="{{ job.rating_width|default:0 }}" style="position:absolute;inset:0 auto 0 0;overflow:hidden;width:0;color:#936a00">&#9733;&#9733;&#9733;&#9733;&#9733;</span></span>
</div>
